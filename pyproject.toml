[project]
name = "justopinion"
version = "0.5.0"
description = "Download client for legal opinions"
authors = [
    {name = "Matt Carey", email = "matt@authorityspoke.com"},
]
license-files = ["license.md"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anchorpoint>=0.9.0",
    "eyecite>=2.7.6",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-ranges>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
build = [
    "build",
    "twine",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "pytest-recording>=0.13.4",
]
docs = [
    "sphinx-autodoc-typehints>=3.17.2",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/mscarey/justopinion"
Documentation = "https://justopinion.readthedocs.io/en/latest/"
Changelog = "https://github.com/mscarey/justopinion/blob/master/changelog.rst"
Issues = "https://github.com/mscarey/justopinion/issues"
